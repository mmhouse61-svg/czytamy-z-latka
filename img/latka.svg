<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 620" width="400" height="620">
  <!-- ŁATKA · wzorzec front · wycinanka z filcu · kontur #4B3A2E -->
  <defs>
    <filter id="latka-felt" x="-15%" y="-15%" width="130%" height="135%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3" result="edgeNoise"/>
      <feDisplacementMap in="SourceGraphic" in2="edgeNoise" scale="3.5" xChannelSelector="R" yChannelSelector="G" result="fuzzy"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.75 1.1" numOctaves="4" seed="7" result="fibre"/>
      <feDiffuseLighting in="fibre" surfaceScale="1.6" lighting-color="#FFFFFF" result="light">
        <feDistantLight azimuth="225" elevation="58"/>
      </feDiffuseLighting>
      <feComponentTransfer in="light" result="lightSoft">
        <feFuncR type="linear" slope="0.42" intercept="0.6"/>
        <feFuncG type="linear" slope="0.42" intercept="0.6"/>
        <feFuncB type="linear" slope="0.42" intercept="0.6"/>
      </feComponentTransfer>
      <feBlend in="fuzzy" in2="lightSoft" mode="multiply" result="textured"/>
      <feComposite in="textured" in2="fuzzy" operator="in" result="felt"/>
      <feGaussianBlur in="fuzzy" stdDeviation="2.5" result="blur"/>
      <feOffset in="blur" dx="2" dy="4" result="offBlur"/>
      <feFlood flood-color="#3A2414" flood-opacity="0.35"/>
      <feComposite in2="offBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="felt"/></feMerge>
    </filter>
  </defs>
  <g id="latka" stroke="#4B3A2E" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <ellipse id="latka-shadow" cx="200" cy="594" rx="100" ry="11" fill="#000" fill-opacity=".12" stroke="none"/>

    <!-- ogonek widoczny tylko w widoku z boku / z tyłu -->
    <circle id="latka-tail" cx="290" cy="500" r="22" fill="#F8F8F8" display="none" filter="url(#latka-felt)"/>

    <g id="latka-leg-l" filter="url(#latka-felt)">
      <path d="M142 518 C130 545 130 575 150 582 C172 588 190 580 192 560 L190 528 Z" fill="#A7CFA0"/>
      <ellipse cx="160" cy="572" rx="17" ry="8" fill="#F4A7BD" stroke-width="2"/>
    </g>
    <g id="latka-leg-r" filter="url(#latka-felt)">
      <path d="M258 518 C270 545 270 575 250 582 C228 588 210 580 208 560 L210 528 Z" fill="#A7CFA0"/>
      <ellipse cx="240" cy="572" rx="17" ry="8" fill="#F4A7BD" stroke-width="2"/>
    </g>

    <g id="latka-body" filter="url(#latka-felt)">
      <path d="M150 340 C118 380 112 470 122 520 C132 548 268 548 278 520 C288 470 282 380 250 340 Z" fill="#A7CFA0"/>
      <path class="stitch" d="M150 340 C118 380 112 470 122 520 C132 548 268 548 278 520 C288 470 282 380 250 340" transform="translate(20 44.5) scale(.9)" fill="none" stroke="#FFF3D6" stroke-width="2" stroke-dasharray="6 6"/>
      <g id="latka-belly">
        <rect x="160" y="404" width="80" height="80" rx="10" fill="#F4A7BD"/>
        <rect x="168" y="412" width="64" height="64" rx="6" fill="none" stroke-width="2.2" stroke-dasharray="6 5"/>
      </g>
    </g>

    <g id="latka-arm-l" filter="url(#latka-felt)">
      <path d="M132 372 C106 390 92 430 96 462 C100 482 126 480 128 462 C130 440 136 418 146 402 Z" fill="#A7CFA0"/>
    </g>
    <g id="latka-arm-r" filter="url(#latka-felt)">
      <path d="M268 372 C294 390 308 430 304 462 C300 482 274 480 272 462 C270 440 264 418 254 402 Z" fill="#A7CFA0"/>
    </g>

    <g id="latka-ear-l" filter="url(#latka-felt)">
      <ellipse cx="158" cy="92" rx="30" ry="92" fill="#A7CFA0" transform="rotate(-6 158 170)"/>
      <ellipse cx="158" cy="98" rx="14" ry="68" fill="#F4A7BD" stroke="none" transform="rotate(-6 158 170)"/>
      <ellipse class="stitch" cx="158" cy="98" rx="20" ry="76" fill="none" stroke="#FFF3D6" stroke-width="1.8" stroke-dasharray="5 5" transform="rotate(-6 158 170)"/>
    </g>
    <g id="latka-ear-r" filter="url(#latka-felt)">
      <ellipse cx="300" cy="105" rx="34" ry="78" fill="#A7CFA0" transform="rotate(35 300 105)"/>
      <ellipse class="stitch" cx="300" cy="105" rx="26" ry="68" fill="none" stroke="#FFF3D6" stroke-width="1.8" stroke-dasharray="5 5" transform="rotate(35 300 105)"/>
      <rect x="286" y="81" width="38" height="38" rx="4" fill="#A9A6C7" transform="rotate(35 305 100)"/>
      <rect x="291" y="86" width="28" height="28" rx="2" fill="none" stroke-width="2" stroke-dasharray="4 4" transform="rotate(35 305 100)"/>
    </g>

    <g id="latka-head" filter="url(#latka-felt)">
      <ellipse cx="200" cy="255" rx="112" ry="102" fill="#A7CFA0"/>
      <ellipse class="stitch" cx="200" cy="255" rx="101" ry="91" fill="none" stroke="#FFF3D6" stroke-width="2" stroke-dasharray="6 6"/>
      <g fill="none" stroke-width="2.5">
        <path d="M134 168 L142 178"/>
        <path d="M146 162 L152 174"/>
        <path d="M160 158 L164 171"/>
      </g>
    </g>

    <g id="latka-face">
      <g id="latka-eye-l" filter="url(#latka-felt)">
        <ellipse cx="160" cy="262" rx="32" ry="38" fill="#FFFFFF"/>
        <ellipse cx="168" cy="266" rx="13" ry="17" fill="#1E1410" stroke="none"/>
      </g>
      <circle id="latka-eye-shine" cx="163" cy="258" r="5" fill="#FFFFFF" stroke="none"/>
      <g id="latka-eye-r" filter="url(#latka-felt)">
        <circle cx="248" cy="262" r="28" fill="#FFF3D6"/>
        <circle cx="248" cy="262" r="20" fill="none" stroke-width="2"/>
        <path d="M238 252 L258 272 M258 252 L238 272" fill="none" stroke-width="4"/>
      </g>
      <path id="latka-nose" d="M196 296 L214 296 L205 307 Z" fill="#F4A7BD" stroke-width="2.5" filter="url(#latka-felt)"/>
      <path id="latka-mouth" d="M190 314 Q197 322 205 312 Q213 322 220 314" fill="none" stroke-width="3"/>
      <g id="latka-whiskers" fill="none" stroke-width="2.5">
        <path d="M150 300 L118 294 M150 308 L116 310 M150 316 L120 326"/>
        <path d="M260 300 L292 294 M260 308 L294 310 M260 316 L290 326"/>
      </g>
    </g>
  </g>
</svg>
