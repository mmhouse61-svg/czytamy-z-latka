<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520">
  <!-- ZIEMEK · wzorzec front · wycinanka z filcu · kontur #5B3E28 -->
  <defs>
    <filter id="ziemek-felt" x="-15%" y="-15%" width="130%" height="135%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3" result="edgeNoise"/>
      <feDisplacementMap in="SourceGraphic" in2="edgeNoise" scale="3.5" xChannelSelector="R" yChannelSelector="G" result="fuzzy"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.75 1.1" numOctaves="4" seed="7" result="fibre"/>
      <feDiffuseLighting in="fibre" surfaceScale="1.6" lighting-color="#FFFFFF" result="light">
        <feDistantLight azimuth="225" elevation="58"/>
      </feDiffuseLighting>
      <feComponentTransfer in="light" result="lightSoft">
        <feFuncR type="linear" slope="0.42" intercept="0.6"/>
        <feFuncG type="linear" slope="0.42" intercept="0.6"/>
        <feFuncB type="linear" slope="0.42" intercept="0.6"/>
      </feComponentTransfer>
      <feBlend in="fuzzy" in2="lightSoft" mode="multiply" result="textured"/>
      <feComposite in="textured" in2="fuzzy" operator="in" result="felt"/>
      <feGaussianBlur in="fuzzy" stdDeviation="2.5" result="blur"/>
      <feOffset in="blur" dx="2" dy="4" result="offBlur"/>
      <feFlood flood-color="#3A2414" flood-opacity="0.35"/>
      <feComposite in2="offBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="felt"/></feMerge>
    </filter>
  </defs>
  <g id="ziemek" stroke="#5B3E28" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <ellipse id="ziemek-shadow" cx="200" cy="490" rx="118" ry="12" fill="#000" fill-opacity=".12" stroke="none"/>

    <g id="ziemek-leg-l" filter="url(#ziemek-felt)">
      <rect x="160" y="395" width="20" height="62" rx="9" fill="#D7B56A"/>
      <path d="M128 484 C126 460 146 448 168 448 C192 448 206 462 206 484 Z" fill="#A89BD8"/>
      <ellipse cx="150" cy="474" rx="15" ry="9" fill="#FFFDF5"/>
      <path d="M176 456 C190 458 198 466 199 478" fill="none" stroke="#FFFDF5" stroke-width="2" stroke-dasharray="4 4"/>
    </g>
    <g id="ziemek-leg-r" filter="url(#ziemek-felt)">
      <rect x="220" y="395" width="20" height="62" rx="9" fill="#D7B56A"/>
      <path d="M272 484 C274 460 254 448 232 448 C208 448 194 462 194 484 Z" fill="#A89BD8"/>
      <ellipse cx="250" cy="474" rx="15" ry="9" fill="#FFFDF5"/>
      <path d="M224 456 C210 458 202 466 201 478" fill="none" stroke="#FFFDF5" stroke-width="2" stroke-dasharray="4 4"/>
