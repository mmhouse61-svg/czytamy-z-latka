    <g id="ziemek-body" filter="url(#ziemek-felt)">
      <path d="M200 100 C280 100 322 190 322 280 C322 360 270 418 200 418 C130 418 78 360 78 280 C78 190 120 100 200 100 Z" fill="#D7B56A"/>
      <g id="ziemek-spots" fill="#B89655" stroke="none">
        <ellipse cx="112" cy="232" rx="6" ry="9"/>
        <ellipse cx="122" cy="306" rx="7" ry="10"/>
        <ellipse cx="142" cy="372" rx="6" ry="8"/>
