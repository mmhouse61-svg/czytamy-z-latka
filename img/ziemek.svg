    </g>

    <g id="ziemek-face">
      <g id="ziemek-brows" fill="none" stroke-width="5" filter="url(#ziemek-felt)">
        <path d="M146 178 Q164 166 182 175"/>
        <path d="M254 178 Q236 166 218 175"/>
      </g>
      <g id="ziemek-eyes" filter="url(#ziemek-felt)">
