<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 740" width="400" height="740">
  <!-- TATO · wzorzec front · wycinanka z filcu · kontur #3B2A1E -->
  <defs>
    <pattern id="tato-plaid" width="28" height="28" patternUnits="userSpaceOnUse">
      <rect width="28" height="28" fill="#C7643B"/>
      <rect x="0" y="10" width="28" height="8" fill="#A9502C" opacity=".75"/>
      <rect x="10" y="0" width="8" height="28" fill="#A9502C" opacity=".75"/>
      <rect x="0" y="13" width="28" height="2" fill="#E08A5E"/>
      <rect x="13" y="0" width="2" height="28" fill="#E08A5E"/>
    </pattern>
    <filter id="tato-felt" x="-15%" y="-15%" width="130%" height="135%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3" result="edgeNoise"/>
      <feDisplacementMap in="SourceGraphic" in2="edgeNoise" scale="3.5" xChannelSelector="R" yChannelSelector="G" result="fuzzy"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.75 1.1" numOctaves="4" seed="7" result="fibre"/>
      <feDiffuseLighting in="fibre" surfaceScale="1.6" lighting-color="#FFFFFF" result="light">
        <feDistantLight azimuth="225" elevation="58"/>
      </feDiffuseLighting>
      <feComponentTransfer in="light" result="lightSoft">
        <feFuncR type="linear" slope="0.42" intercept="0.6"/>
        <feFuncG type="linear" slope="0.42" intercept="0.6"/>
        <feFuncB type="linear" slope="0.42" intercept="0.6"/>
      </feComponentTransfer>
      <feBlend in="fuzzy" in2="lightSoft" mode="multiply" result="textured"/>
      <feComposite in="textured" in2="fuzzy" operator="in" result="felt"/>
      <feGaussianBlur in="fuzzy" stdDeviation="2.5" result="blur"/>
      <feOffset in="blur" dx="2" dy="4" result="offBlur"/>
      <feFlood flood-color="#3A2414" flood-opacity="0.35"/>
      <feComposite in2="offBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="felt"/></feMerge>
    </filter>
  </defs>
  <g id="tato" stroke="#3B2A1E" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <ellipse id="tato-shadow" cx="200" cy="718" rx="120" ry="12" fill="#000" fill-opacity=".12" stroke="none"/>

    <g id="tato-leg-l" filter="url(#tato-felt)">
      <path d="M118 470 L198 470 L192 682 L122 682 Z" fill="#4F7CC2"/>
      <path class="stitch" d="M128 480 L131 656 M188 480 L184 656" fill="none" stroke="#FFF3D6" stroke-width="2" stroke-dasharray="6 6"/>
      <path d="M123 662 L193 662" fill="none" stroke-width="2.5"/>
      <path d="M110 712 C106 686 130 676 160 676 C186 676 198 690 196 712 Z" fill="#623F2A"/>
      <path class="stitch" d="M118 704 C118 690 136 684 160 684 C180 684 188 694 188 704" fill="none" stroke="#FFF3D6" stroke-width="2" stroke-dasharray="4 4"/>
    </g>
    <g id="tato-leg-r" filter="url(#tato-felt)">
      <path d="M202 470 L282 470 L278 682 L208 682 Z" fill="#4F7CC2"/>
      <path class="stitch" d="M272 480 L269 656 M212 480 L216 656" fill="none" stroke="#FFF3D6" stroke-width="2" stroke-dasharray="6 6"/>
      <path d="M207 662 L277 662" fill="none" stroke-width="2.5"/>
      <path d="M290 712 C294 686 270 676 240 676 C214 676 202 690 204 712 Z" fill="#623F2A"/>
      <path class="stitch" d="M282 704 C282 690 264 684 240 684 C220 684 212 694 212 704" fill="none" stroke="#FFF3D6" stroke-width="2" stroke-dasharray="4 4"/>
    </g>

    <g id="tato-torso" filter="url(#tato-felt)">
      <path d="M118 262 C140 250 260 250 282 262 C300 272 304 300 300 340 L292 478 L108 478 L100 340 C96 300 100 272 118 262 Z" fill="url(#tato-plaid)"/>
      <path d="M200 268 L200 462" fill="none" stroke-width="2.5"/>
      <path class="stitch" d="M192 270 L192 456 M208 270 L208 456" fill="none" stroke="#FFF3D6" stroke-width="1.8" stroke-dasharray="4 4"/>
      <g fill="#FBEBD0" stroke-width="2">
        <circle cx="200" cy="300" r="5.5"/>
        <circle cx="200" cy="346" r="5.5"/>
        <circle cx="200" cy="392" r="5.5"/>
        <circle cx="200" cy="438" r="5.5"/>
      </g>
    </g>

    <g id="tato-arm-l" filter="url(#tato-felt)">
      <path d="M116 266 C92 272 82 300 80 340 L76 420 C76 434 106 436 108 420 L114 330 Z" fill="url(#tato-plaid)"/>
      <path class="stitch" d="M80 412 L106 412" fill="none" stroke="#FFF3D6" stroke-width="2" stroke-dasharray="4 4"/>
      <circle cx="92" cy="440" r="20" fill="#F6C89F"/>
    </g>
    <g id="tato-arm-r" filter="url(#tato-felt)">
      <path d="M284 266 C308 272 318 300 320 340 L324 420 C324 434 294 436 292 420 L286 330 Z" fill="url(#tato-plaid)"/>
      <path class="stitch" d="M320 412 L294 412" fill="none" stroke="#FFF3D6" stroke-width="2" stroke-dasharray="4 4"/>
      <circle cx="308" cy="440" r="20" fill="#F6C89F"/>
    </g>

    <g id="tato-belt" filter="url(#tato-felt)">
      <rect x="106" y="456" width="188" height="26" rx="4" fill="#623F2A"/>
      <path class="stitch" d="M112 462 L182 462 M218 462 L288 462 M112 476 L182 476 M218 476 L288 476" fill="none" stroke="#FFF3D6" stroke-width="1.8" stroke-dasharray="4 4"/>
      <rect x="185" y="453" width="30" height="32" rx="5" fill="#FFD54A"/>
      <g id="tato-pouch">
        <rect x="250" y="466" width="44" height="60" rx="8" fill="#7B5A3A"/>
        <path d="M250 486 L294 486" fill="none" stroke-width="2.5"/>
        <rect class="stitch" x="256" y="492" width="32" height="28" rx="5" fill="none" stroke="#FFF3D6" stroke-width="1.8" stroke-dasharray="4 4"/>
      </g>
      <g id="tato-hammer" transform="rotate(8 134 474)">
        <rect x="128" y="474" width="13" height="82" rx="5" fill="#C8934A"/>
        <rect x="108" y="550" width="50" height="22" rx="4" fill="#9AA0A6"/>
      </g>
    </g>

    <g id="tato-head">
