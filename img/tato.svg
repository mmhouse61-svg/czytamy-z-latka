        <circle cx="118" cy="172" r="20" fill="#F6C89F"/>
        <circle cx="282" cy="172" r="20" fill="#F6C89F"/>
        <ellipse cx="200" cy="160" rx="82" ry="92" fill="#F6C89F"/>
      </g>
      <g id="tato-hair" filter="url(#tato-felt)">
        <path d="M116 152 C106 80 150 46 205 46 C262 46 296 82 286 152 C278 122 262 106 240 100 C210 92 170 96 150 106 C132 116 122 132 116 152 Z" fill="#623F2A"/>
        <path d="M168 52 C160 70 156 88 156 102" fill="none" stroke-width="2.5"/>
        <path class="stitch" d="M126 136 C122 90 156 60 205 60 C254 60 282 90 276 136" fill="none" stroke="#FFF3D6" stroke-width="2" stroke-dasharray="5 5"/>
      </g>
      <g id="tato-beard" filter="url(#tato-felt)">
        <path d="M118 160 C116 232 150 284 200 286 C250 284 284 232 282 160 C276 196 262 214 244 218 C230 222 214 214 200 214 C186 214 170 222 156 218 C138 214 124 196 118 160 Z" fill="#623F2A"/>
        <path class="stitch" d="M130 186 C136 238 162 272 200 274 C238 272 264 238 270 186" fill="none" stroke="#FFF3D6" stroke-width="2" stroke-dasharray="5 5"/>
      </g>
      <path id="tato-mouth" d="M188 236 Q200 242 212 236" fill="none" stroke="#2A1A10" stroke-width="3"/>
      <path id="tato-moustache" d="M156 216 C168 198 192 198 200 208 C208 198 232 198 244 216 C228 228 210 224 200 218 C190 224 172 228 156 216 Z" fill="#623F2A" filter="url(#tato-felt)"/>
      <ellipse id="tato-nose" cx="200" cy="192" rx="17" ry="14" fill="#F6C89F" filter="url(#tato-felt)"/>
      <g id="tato-eyes" filter="url(#tato-felt)">
        <ellipse cx="168" cy="150" rx="20" ry="24" fill="#FFFFFF" stroke="none"/>
        <ellipse cx="232" cy="150" rx="20" ry="24" fill="#FFFFFF" stroke="none"/>
        <ellipse cx="173" cy="154" rx="8" ry="11" fill="#1E1410" stroke="none"/>
        <ellipse cx="227" cy="154" rx="8" ry="11" fill="#1E1410" stroke="none"/>
      </g>
      <g id="tato-eye-shine" fill="#FFFFFF" stroke="none">
        <circle cx="170" cy="149" r="3"/>
        <circle cx="224" cy="149" r="3"/>
      </g>
      <g id="tato-glasses" fill="none" stroke="#1E1410" stroke-width="4">
        <circle cx="168" cy="150" r="31"/>
        <circle cx="232" cy="150" r="31"/>
        <path d="M197 144 Q200 138 203 144"/>
        <path d="M137 146 L118 154"/>
        <path d="M263 146 L282 154"/>
      </g>
      <g id="tato-brows" fill="none" stroke="#623F2A" stroke-width="8" filter="url(#tato-felt)">
        <path d="M146 110 Q168 100 190 110"/>
        <path d="M210 110 Q232 100 254 110"/>
      </g>
    </g>
  </g>
</svg>
